  - { name: "Atlas",            type: Service, aliases: ["Atlas API Gateway", "the gateway"] }
  - { name: "Ember",            type: Service, aliases: ["Ember Authentication Service", "Ember Auth"] }
  - { name: "Beacon",           type: Service, aliases: ["Beacon Telemetry Platform"] }
