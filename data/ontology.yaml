# Ontology for the knowledge-graph approach.
#
# This file is the ONLY hand-authored input to graph construction. It declares
# what kinds of things exist, what they are called, and which surface patterns
# in prose express which relations. Everything else -- every node and every
# edge in the graph -- is extracted from data/raw/*.txt by kgraph/extract.py.
#
# Nothing in data/raw contains machine-readable relations. That is deliberate:
# a KG demo where the edges were pre-declared in frontmatter would be a
# demo of reading YAML, not of building a knowledge graph.

entity_types:
  Service:   { color: "#4f8dfd", shape: "circle" }
  Person:    { color: "#f5a524", shape: "circle" }
  Team:      { color: "#22c55e", shape: "circle" }
  Incident:  { color: "#ef4444", shape: "diamond" }
  Bug:       { color: "#f472b6", shape: "diamond" }
  Policy:    { color: "#a78bfa", shape: "square" }
  Vendor:    { color: "#14b8a6", shape: "square" }
  Runbook:   { color: "#94a3b8", shape: "square" }

# Canonical entities and their surface aliases. The extractor builds a
# gazetteer from this; longest alias wins when two overlap.
entities:
