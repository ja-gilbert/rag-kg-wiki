# Relation extraction patterns.
#
#   pattern    regex with named groups (?P<s>...) and (?P<o>...) which must
#              each match an ENTITY placeholder written as {E}
#   inverse    if true, the matched (s, o) is emitted as (o, predicate, s)
#
# {E} is expanded by the extractor into an alternation over every known alias.
relations:
  owned_by:
    label: "owned by"
    inverse_label: "owns"
    patterns:
      - "{s} is owned by {o}"
      - "{s} is maintained by {o}"
      - "{s} team owns {o}||inverse"
      - "{s} owns {o}||inverse"
      - "The team owns {o}"          # subject resolved from document entity
  led_by:
    label: "led by"
    inverse_label: "leads"
    patterns:
      - "{s} is led by {o}"
      - "{s} leads {o}||inverse"
  member_of:
    label: "member of"
    inverse_label: "has member"
    patterns:
      - "{s} is a member of {o}"
      - "{s} joined {o}"
  depends_on:
    label: "depends on"
    inverse_label: "required by"
    patterns:
      - "{s} depends on {o}"
      - "{s} reads from {o}"
      - "{s} calls {o}"
      - "{s} requires {o}"
  runs_on:
    label: "runs on"
    inverse_label: "hosts"
    patterns:
      - "{s} runs on {o}"
      - "{s} is hosted on {o}"
      - "{s} is deployed on {o}"
      - "{s} all run on {o}"
  caused_by:
    label: "caused by"
    inverse_label: "caused"
    patterns:
      - "{s} was caused by {o}"
      - "{s} caused {o}||inverse"
      - "{s} was the cause of {o}||inverse"
      - "{s} was the origin of {o}||inverse"
  affects:
    label: "affects"
    inverse_label: "affected by"
    patterns:
      - "{s} affected {o}"
      - "{s} affects {o}"
      - "{s} was affected by {o}||inverse"
      - "{s} impacted {o}"
  reported_by:
    label: "reported by"
    inverse_label: "reported"
    patterns:
      - "{s} was reported by {o}"
      - "{s} reported {o}||inverse"
  resolved_by:
    label: "resolved by"
    inverse_label: "resolved"
    patterns:
      - "{s} was resolved by {o}"
      - "{s} resolved {o}||inverse"
  fixed_by:
    label: "fixed by"
    inverse_label: "fixed"
    patterns:
      - "{s} was fixed by {o}"
      - "{s} fixed {o}||inverse"
  triggered:
    label: "triggered"
    inverse_label: "triggered by"
    patterns:
      - "{s} triggered {o}"
      - "{s} was triggered by {o}||inverse"
      - "{s} produced {o}"
  supersedes:
    label: "supersedes"
    inverse_label: "superseded by"
    patterns:
      - "{s} supersedes {o}"
      - "{s} replaces {o}"
      - "{s} was superseded by {o}||inverse"
  governs:
    label: "governs"
    inverse_label: "governed by"
    patterns:
      - "{s} governs {o}"
      - "{s} applies to {o}"
      - "{s} covers {o}"
      - "The {s} governs {o}"
  authored_by:
    label: "authored by"
    inverse_label: "authored"
    patterns:
      - "{s} was authored by {o}"
      - "{s} was drafted by {o}"
      - "{s} authored {o}||inverse"
      - "{s} drafted {o}||inverse"
  provides:
    label: "provides"
    inverse_label: "provided by"
    patterns:
      - "{s} provides {o}"
      - "{s} is provided by {o}||inverse"
